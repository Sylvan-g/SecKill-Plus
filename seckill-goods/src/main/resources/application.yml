server:
  port: 8200

spring:
  application:
    name: seckill-goods
  profiles:
    default: local            # 本机默认加载 application-local.yml（口令不入库）；部署改用环境变量
  datasource:
    url: jdbc:mysql://localhost:3306/seckill_goods?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 口令禁止入库：值来自环境变量 SECKILL_DB_PASSWORD，或本机 application-local.yml（已被 .gitignore 忽略）
    password: ${SECKILL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

sa-token:
  # token 放请求头 Authorization，值形如 "Bearer <token>"（需求文档 8.12/8.13）
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400            # 会话有效期（秒）= 1 天；5 个服务必须保持一致
  is-concurrent: true
  is-share: true
  is-read-cookie: false     # 前后端分离，只从请求头读取
  is-read-header: true
  is-log: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto